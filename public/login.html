<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SIPALA</title>
    <link rel="stylesheet" href="./css/tailwind.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
      <div class="card">
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 bg-primary-600 rounded-lg mx-auto mb-4 flex items-center justify-center"
          >
            <i class="fas fa-tools text-2xl text-white"></i>
          </div>
          <h1 class="text-2xl font-bold text-gray-900">SIPALA</h1>
          <p class="text-gray-600">Sistem Peminjaman Alat</p>
        </div>

        <form id="login-form" class="space-y-6">
          <div>
            <label class="form-label">Email</label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="your@email.com"
              required
            />
          </div>

          <div>
            <label class="form-label">Password</label>
            <div class="relative">
              <input
                type="password"
                id="password"
                class="form-input pr-10"
                placeholder="••••••"
                required
              />
              <button
                type="button"
                id="toggle-password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <label class="flex items-center">
              <input
                type="checkbox"
                class="rounded border-gray-300 text-primary-600 focus:ring-primary-500"
              />
              <span class="ml-2 text-sm text-gray-600">Remember me</span>
            </label>
            <a href="#" class="text-sm text-primary-600 hover:text-primary-700"
              >Forgot password?</a
            >
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="w-full btn-primary flex items-center justify-center gap-2"
          >
            <span>Login</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-sm text-gray-600">
            Don't have an account?
            <a
              href="./register.html"
              class="text-primary-600 hover:text-primary-700 font-medium"
              >Register</a
            >
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      import { authApi } from "../src/api/auth.js";
      import { redirectIfLoggedIn } from "../src/utils/auth.js";
      import { toast } from "../src/components/Toast.js";

      // Redirect if already logged in
      if (redirectIfLoggedIn()) {
        throw new Error("Already logged in");
      }

      // Toggle password visibility
      document
        .getElementById("toggle-password")
        .addEventListener("click", function () {
          const passwordInput = document.getElementById("password");
          const icon = this.querySelector("i");

          if (passwordInput.type === "password") {
            passwordInput.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
          } else {
            passwordInput.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
          }
        });

      // Handle login
      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const submitBtn = document.getElementById("submit-btn");
          const originalText = submitBtn.innerHTML;
          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Loading...';

          try {
            const credentials = {
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            };

            const response = await authApi.login(credentials);

            if (response.code === 200) {
              toast.success("Login successful! Redirecting...");
              setTimeout(() => {
                window.location.href = "./dashboard.html";
              }, 1000);
            } else {
              toast.error(response.message || "Login failed");
            }
          } catch (error) {
            toast.error(error.message || "Network error");
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
          }
        });
    </script>
  </body>
</html>
