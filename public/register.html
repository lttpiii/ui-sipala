<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - SIPALA</title>
    <link rel="stylesheet" href="./css/tailwind.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
      <div class="card">
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 bg-primary-600 rounded-lg mx-auto mb-4 flex items-center justify-center"
          >
            <i class="fas fa-user-plus text-2xl text-white"></i>
          </div>
          <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
          <p class="text-gray-600">Register as borrower</p>
        </div>

        <form id="register-form" class="space-y-4">
          <div>
            <label class="form-label">Full Name</label>
            <input
              type="text"
              id="name"
              class="form-input"
              placeholder="John Doe"
              required
              minlength="3"
            />
          </div>

          <div>
            <label class="form-label">Email</label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="your@email.com"
              required
            />
          </div>

          <div>
            <label class="form-label">Password</label>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Min 6 characters"
              required
              minlength="6"
            />
          </div>

          <div>
            <label class="form-label">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              class="form-input"
              placeholder="Confirm password"
              required
            />
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="w-full btn-primary flex items-center justify-center gap-2"
          >
            <span>Register</span>
            <i class="fas fa-user-plus"></i>
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-sm text-gray-600">
            Already have an account?
            <a
              href="./login.html"
              class="text-primary-600 hover:text-primary-700 font-medium"
              >Login</a
            >
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      import { authApi } from "../src/api/auth.js";
      import { redirectIfLoggedIn } from "../src/utils/auth.js";
      import { toast } from "../src/components/Toast.js";

      // Redirect if already logged in
      if (redirectIfLoggedIn()) {
        throw new Error("Already logged in");
      }

      document
        .getElementById("register-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const submitBtn = document.getElementById("submit-btn");
          const originalText = submitBtn.innerHTML;
          submitBtn.disabled = true;
          submitBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Loading...';

          try {
            const password = document.getElementById("password").value;
            const confirmPassword =
              document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
              toast.error("Passwords do not match");
              return;
            }

            const userData = {
              name: document.getElementById("name").value,
              email: document.getElementById("email").value,
              password: password,
            };

            const response = await authApi.register(userData);

            if (response.code === 201) {
              toast.success("Registration successful! Please login.");
              setTimeout(() => {
                window.location.href = "./login.html";
              }, 1500);
            } else {
              toast.error(response.message || "Registration failed");
            }
          } catch (error) {
            toast.error(error.message || "Network error");
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
          }
        });
    </script>
  </body>
</html>
